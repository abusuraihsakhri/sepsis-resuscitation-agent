[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sepsis-resuscitation-engine"
version = "2.0.1"
description = "Synthetic-data sepsis resuscitation rule demonstration and arithmetic sandbox"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["pydantic>=2,<3"]

[project.optional-dependencies]
server = ["fastapi>=0.110,<1", "uvicorn>=0.27,<1"]
test = ["pytest>=8,<10", "httpx>=0.27,<1", "fastapi>=0.110,<1"]

[project.scripts]
sepsis-resuscitation-engine = "sepsis_resuscitation_agent.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/sepsis-resuscitation-agent"
Repository = "https://github.com/abusuraihsakhri/sepsis-resuscitation-agent"

[tool.setuptools.packages.find]
include = ["agents*", "sepsis_resuscitation_agent*"]
namespaces = false
