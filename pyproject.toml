[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sepsis-resuscitation-engine"
version = "2.0.0"
description = "Sepsis-3 Resuscitation Sentinel: Dynamic Lactate Clearance & Bundle Compliance Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
sepsis-resuscitation-engine = "sepsis_resuscitation_agent.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/sepsis-resuscitation-engine"
Repository = "https://github.com/abusuraihsakhri/sepsis-resuscitation-engine.git"
